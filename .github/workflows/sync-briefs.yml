name: Sync SignalFind AI Briefs

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Brief to sync"
        required: true
        default: us
        type: choice
        options:
          - us
          - kr
  schedule:
    # KR only: 09:40~15:40 KST weekdays, once per hour.
    - cron: "40 0-6 * * 1-5"

permissions:
  contents: write

concurrency:
  group: signalfind-ai-brief-sync-${{ github.event_name }}-${{ inputs.target || 'kr' }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET: ${{ github.event_name == 'schedule' && 'kr' || inputs.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch selected brief
        id: fetch
        shell: bash
        run: |
          set -euo pipefail

          case "$TARGET" in
            kr)
              URL="https://signalfind.co.kr/ai/brief-latest.txt"
              FILE="kr-brief.txt"
              ;;
            us)
              URL="https://hhmgsaprbpcdajniykro.supabase.co/storage/v1/object/public/signalfind-us/latest/ai/brief.txt"
              FILE="us-brief.txt"
              ;;
            *)
              echo "Unknown target: $TARGET" >&2
              exit 1
              ;;
          esac

          TMP="$(mktemp)"
          curl --fail --location --silent --show-error \
            --connect-timeout 15 --max-time 60 \
            --retry 2 --retry-delay 2 \
            --user-agent "SignalFind-Public-Mirror/1.0" \
            "$URL" -o "$TMP"

          BYTES="$(wc -c < "$TMP" | tr -d ' ')"
          if [ "$BYTES" -lt 512 ]; then
            echo "Brief too small: $FILE ($BYTES bytes)" >&2
            exit 1
          fi
          if grep -qiE '^\s*<!doctype html|^\s*<html' "$TMP"; then
            echo "Unexpected HTML response: $FILE" >&2
            exit 1
          fi

          mv "$TMP" "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "SYNC_FETCH_PASS target=$TARGET file=$FILE bytes=$BYTES"

      - name: Commit only when selected brief changed
        shell: bash
        run: |
          set -euo pipefail
          FILE="${{ steps.fetch.outputs.file }}"

          if git diff --quiet -- "$FILE" && git ls-files --error-unmatch "$FILE" >/dev/null 2>&1; then
            echo "BRIEF_UNCHANGED target=$TARGET file=$FILE"
            exit 0
          fi

          git config user.name "signalfind-ai-brief-bot"
          git config user.email "signalfind-ai-brief-bot@users.noreply.github.com"
          git add "$FILE"
          git commit -m "chore: refresh ${TARGET^^} public AI brief"
          git push
