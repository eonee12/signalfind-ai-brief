name: Sync SignalFind AI Briefs

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Brief to sync"
        required: true
        default: us
        type: choice
        options:
          - us
          - kr
  # 05:10 KST Tue-Sat: one fallback sync after the 05:00 KST US batch refresh.
  # No recurring 5-minute polling/commits.
  schedule:
    - cron: "10 20 * * 1-5"

permissions:
  contents: write

concurrency:
  group: signalfind-ai-brief-sync-${{ github.event_name }}-${{ inputs.target || 'us' }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET: ${{ inputs.target || 'us' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch selected brief and CURRENT MASTER
        id: fetch
        shell: bash
        run: |
          set -euo pipefail

          case "$TARGET" in
            kr)
              URL="https://signalfind.co.kr/ai/brief-latest.txt"
              DOC_URL="https://docs.google.com/document/d/1LCZZ5xl6u2y5vvxR2XgF3nZ_nm3P9nX4kyuk3-QLvM8/export?format=txt"
              DOC_TITLE="SignalFind KR CURRENT MASTER"
              FILE="kr-brief.txt"
              ;;
            us)
              URL="https://hhmgsaprbpcdajniykro.supabase.co/storage/v1/object/public/signalfind-us/latest/ai/brief.txt"
              DOC_URL="https://docs.google.com/document/d/1wNwzk-jcW5N1UpMz_SCF338GYcvTm2jYjw6m5pTVa9w/export?format=txt"
              DOC_TITLE="SignalFind US CURRENT MASTER"
              FILE="us-brief.txt"
              ;;
            *)
              echo "Unknown target: $TARGET" >&2
              exit 1
              ;;
          esac

          BRIEF_TMP="$(mktemp)"
          DOC_TMP="$(mktemp)"
          COMBINED_TMP="$(mktemp)"

          curl --fail --location --silent --show-error \
            --connect-timeout 15 --max-time 60 \
            --retry 2 --retry-delay 2 \
            --user-agent "SignalFind-Public-Mirror/1.0" \
            "$URL" -o "$BRIEF_TMP"

          BRIEF_BYTES="$(wc -c < "$BRIEF_TMP" | tr -d ' ')"
          if [ "$BRIEF_BYTES" -lt 512 ]; then
            echo "Brief too small: $FILE ($BRIEF_BYTES bytes)" >&2
            exit 1
          fi
          if grep -qiE '^\s*<!doctype html|^\s*<html' "$BRIEF_TMP"; then
            echo "Unexpected HTML response: $FILE" >&2
            exit 1
          fi

          curl --fail --location --silent --show-error \
            --connect-timeout 15 --max-time 60 \
            --retry 2 --retry-delay 2 \
            --user-agent "SignalFind-Public-Mirror/1.0" \
            "$DOC_URL" -o "$DOC_TMP"

          DOC_BYTES="$(wc -c < "$DOC_TMP" | tr -d ' ')"
          if [ "$DOC_BYTES" -lt 200 ]; then
            echo "CURRENT MASTER too small: $TARGET ($DOC_BYTES bytes)" >&2
            exit 1
          fi
          if grep -qiE '^\s*<!doctype html|^\s*<html' "$DOC_TMP"; then
            echo "Unexpected HTML response from CURRENT MASTER: $TARGET" >&2
            exit 1
          fi

          cat "$BRIEF_TMP" > "$COMBINED_TMP"
          printf '\n\n============================================================\n' >> "$COMBINED_TMP"
          printf '[CURRENT MASTER — GOOGLE DOC]\n' >> "$COMBINED_TMP"
          printf '%s\n' "$DOC_TITLE" >> "$COMBINED_TMP"
          printf '============================================================\n\n' >> "$COMBINED_TMP"
          cat "$DOC_TMP" >> "$COMBINED_TMP"
          printf '\n' >> "$COMBINED_TMP"

          mv "$COMBINED_TMP" "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "SYNC_FETCH_PASS target=$TARGET file=$FILE brief_bytes=$BRIEF_BYTES doc_bytes=$DOC_BYTES"

      - name: Commit only when selected brief changed
        shell: bash
        run: |
          set -euo pipefail
          FILE="${{ steps.fetch.outputs.file }}"

          if git diff --quiet -- "$FILE" && git ls-files --error-unmatch "$FILE" >/dev/null 2>&1; then
            echo "BRIEF_UNCHANGED target=$TARGET file=$FILE"
            exit 0
          fi

          git config user.name "signalfind-ai-brief-bot"
          git config user.email "signalfind-ai-brief-bot@users.noreply.github.com"
          git add "$FILE"
          git commit -m "chore: refresh ${TARGET^^} public AI brief"
          git push
