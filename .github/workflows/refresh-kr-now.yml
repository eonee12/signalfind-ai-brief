name: Refresh KR Brief Now

on:
  workflow_dispatch:
    inputs:
      after_utc:
        description: "Wait until Supabase KR mirror is newer than this UTC time"
        required: false
        default: ""
        type: string
  push:
    paths:
      - ".github/workflows/refresh-kr-now.yml"
  # Force-sync marker: 2026-09-02 12:40 KST recovery.
  # GitHub scheduled workflows can be delayed/dropped. Use several explicit retry slots
  # after each KR mirror refresh instead of relying on a single or */5 cron expression.
  # Mirror primary: 09:40~14:40 KST hourly, final 16:10 KST.
  schedule:
    - cron: "42,45,48,52 0 * * 1-5"
    - cron: "42,45,48,52 1 * * 1-5"
    - cron: "42,45,48,52 2 * * 1-5"
    - cron: "42,45,48,52 3 * * 1-5"
    - cron: "42,45,48,52 4 * * 1-5"
    - cron: "42,45,48,52 5 * * 1-5"
    - cron: "12,15,18,22 7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: signalfind-kr-public-self-heal
  cancel-in-progress: true

jobs:
  refresh-kr-now:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Sync latest KR mirror with CURRENT MASTER
        id: sync
        shell: bash
        env:
          AFTER_UTC: ${{ inputs.after_utc || '' }}
        run: |
          set -euo pipefail
          MIRROR_BRIEF_URL="https://hhmgsaprbpcdajniykro.supabase.co/storage/v1/object/public/signalfind-us/latest/ai/kr-brief.txt"
          MIRROR_META_URL="https://hhmgsaprbpcdajniykro.supabase.co/storage/v1/object/public/signalfind-us/latest/ai/kr-brief-meta.json"
          DOC_URL="https://docs.google.com/document/d/1LCZZ5xl6u2y5vvxR2XgF3nZ_nm3P9nX4kyuk3-QLvM8/export?format=txt"
          FILE="kr-brief.txt"
          META_TMP="$(mktemp)"; BRIEF_TMP="$(mktemp)"; DOC_TMP="$(mktemp)"; COMBINED_TMP="$(mktemp)"
          LAST_UTC="$(sed -n 's/^refreshed_at_utc:[[:space:]]*//p' "$FILE" | head -n1 || true)"
          WAIT_UNTIL="$AFTER_UTC"; [ -n "$WAIT_UNTIL" ] || WAIT_UNTIL="$LAST_UTC"
          MIRROR_UTC=""; MIRROR_SHA=""
          for attempt in $(seq 1 18); do
            curl --fail --location --silent --show-error --connect-timeout 15 --max-time 30 --retry 1 --retry-delay 1 --user-agent "SignalFind-Public-Mirror/1.0" "${MIRROR_META_URL}?_=$(date +%s%N)" -o "$META_TMP"
            MIRROR_UTC="$(python -c 'import json,sys; print(str(json.load(open(sys.argv[1])).get("fetched_at_utc") or "").strip())' "$META_TMP")"
            MIRROR_SHA="$(python -c 'import json,sys; print(str(json.load(open(sys.argv[1])).get("sha256") or "").strip())' "$META_TMP")"
            [ -n "$MIRROR_UTC" ] || { echo "Missing fetched_at_utc" >&2; exit 1; }
            MIRROR_EPOCH="$(date -u -d "$MIRROR_UTC" +%s 2>/dev/null || echo 0)"; WAIT_EPOCH="$(date -u -d "$WAIT_UNTIL" +%s 2>/dev/null || echo 0)"
            if [ -z "$WAIT_UNTIL" ] || [ "$WAIT_EPOCH" -eq 0 ] || [ "$MIRROR_EPOCH" -gt "$WAIT_EPOCH" ]; then break; fi
            [ "$attempt" -lt 18 ] || { echo "KR mirror did not advance" >&2; exit 1; }; sleep 5
          done
          curl --fail --location --silent --show-error --connect-timeout 15 --max-time 60 --retry 2 --retry-delay 2 --user-agent "SignalFind-Public-Mirror/1.0" "${MIRROR_BRIEF_URL}?_=$(date +%s%N)" -o "$BRIEF_TMP"
          BRIEF_BYTES="$(wc -c < "$BRIEF_TMP" | tr -d ' ')"; [ "$BRIEF_BYTES" -ge 10000 ] || { echo "KR mirror brief too small" >&2; exit 1; }
          if [ -n "$MIRROR_SHA" ]; then ACTUAL_SHA="$(sha256sum "$BRIEF_TMP" | awk '{print $1}')"; [ "$ACTUAL_SHA" = "$MIRROR_SHA" ] || { echo "KR mirror SHA mismatch" >&2; exit 1; }; fi
          curl --fail --location --silent --show-error --connect-timeout 15 --max-time 60 --retry 2 --retry-delay 2 --user-agent "SignalFind-Public-Mirror/1.0" "$DOC_URL" -o "$DOC_TMP"
          DOC_BYTES="$(wc -c < "$DOC_TMP" | tr -d ' ')"; [ "$DOC_BYTES" -ge 200 ] || { echo "CURRENT MASTER too small" >&2; exit 1; }
          REFRESHED_KST="$(TZ=Asia/Seoul date -d "$MIRROR_UTC" +'%Y-%m-%dT%H:%M:%S+09:00')"
          { printf '[SIGNALFIND_MIRROR]\nrefreshed_at_kst: %s\nrefreshed_at_utc: %s\nsource_sha256: %s\ntrigger_cron: github:%s:mirror-self-heal\n\n' "$REFRESHED_KST" "$MIRROR_UTC" "$MIRROR_SHA" "${{ github.event_name }}"; cat "$BRIEF_TMP"; printf '\n\n============================================================\n[CURRENT MASTER — GOOGLE DOC]\nSignalFind KR CURRENT MASTER\n============================================================\n\n'; cat "$DOC_TMP"; printf '\n'; } > "$COMBINED_TMP"
          mv "$COMBINED_TMP" "$FILE"; echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Commit KR public brief if changed
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          FILE="kr-brief.txt"
          if git diff --quiet -- "$FILE"; then echo "KR_PUBLIC_SYNC=UNCHANGED"; exit 0; fi
          git config user.name "signalfind-ai-brief-bot"; git config user.email "signalfind-ai-brief-bot@users.noreply.github.com"
          git add "$FILE"; git commit -m "chore: sync KR public AI brief from mirror"; git push
          echo "KR_PUBLIC_SYNC=PASS"
