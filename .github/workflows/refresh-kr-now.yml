name: Refresh KR Brief Now

on:
  workflow_dispatch:
    inputs:
      after_utc:
        description: "Optional minimum brief-full generation time in UTC"
        required: false
        default: ""
        type: string
  push:
    paths:
      - ".github/workflows/refresh-kr-now.yml"
  # Single scheduled run per slot, moved 4 minutes earlier from the previous first slot.
  # If the source fetch/validation fails, retry internally up to 3 times.
  schedule:
    - cron: "38 0 * * 1-5"
    - cron: "38 1 * * 1-5"
    - cron: "38 2 * * 1-5"
    - cron: "38 3 * * 1-5"
    - cron: "38 4 * * 1-5"
    - cron: "38 5 * * 1-5"
    - cron: "8 7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: signalfind-kr-public-self-heal
  cancel-in-progress: true

jobs:
  refresh-kr-now:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync latest KR brief-full with CURRENT MASTER
        id: sync
        shell: bash
        env:
          AFTER_UTC: ${{ inputs.after_utc || '' }}
        run: |
          set -euo pipefail
          SOURCE_URL="https://signalfind.co.kr/ai/brief-full.txt"
          DOC_URL="https://docs.google.com/document/d/1LCZZ5xl6u2y5vvxR2XgF3nZ_nm3P9nX4kyuk3-QLvM8/export?format=txt"
          FILE="kr-brief.txt"
          BRIEF_TMP="$(mktemp)"
          DOC_TMP="$(mktemp)"
          COMBINED_TMP="$(mktemp)"

          FETCH_OK=0
          for attempt in 1 2 3 4; do
            if curl --fail --location --silent --show-error \
              --connect-timeout 15 --max-time 60 \
              --retry 0 \
              --user-agent "SignalFind-Public-Mirror/1.0" \
              "${SOURCE_URL}?_=$(date +%s%N)" -o "$BRIEF_TMP"; then
              BRIEF_BYTES="$(wc -c < "$BRIEF_TMP" | tr -d ' ')"
              if [ "$BRIEF_BYTES" -ge 10000 ] && ! grep -qiE '^\s*<!doctype html|^\s*<html' "$BRIEF_TMP"; then
                FETCH_OK=1
                break
              fi
            fi
            [ "$attempt" -lt 4 ] && sleep 30
          done
          [ "$FETCH_OK" -eq 1 ] || { echo "KR brief-full fetch/validation failed after 3 retries" >&2; exit 1; }

          SOURCE_KST="$(python -c 'import re,sys; t=open(sys.argv[1],encoding="utf-8").read(4096); m=re.search(r"^생성 시각:\s*(\d{4}-\d{2}-\d{2} \d{2}:\d{2}(?::\d{2})?) KST",t,re.M); print(m.group(1) if m else "")' "$BRIEF_TMP")"
          [ -n "$SOURCE_KST" ] || { echo "Missing 생성 시각 in KR brief-full" >&2; exit 1; }
          SOURCE_UTC="$(python -c 'from datetime import datetime,timezone; from zoneinfo import ZoneInfo; import sys; s=sys.argv[1]; f="%Y-%m-%d %H:%M:%S" if len(s)==19 else "%Y-%m-%d %H:%M"; d=datetime.strptime(s,f).replace(tzinfo=ZoneInfo("Asia/Seoul")); print(d.astimezone(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"))' "$SOURCE_KST")"
          SOURCE_KST_ISO="$(python -c 'from datetime import datetime; from zoneinfo import ZoneInfo; import sys; s=sys.argv[1]; f="%Y-%m-%d %H:%M:%S" if len(s)==19 else "%Y-%m-%d %H:%M"; d=datetime.strptime(s,f).replace(tzinfo=ZoneInfo("Asia/Seoul")); print(d.isoformat(timespec="seconds"))' "$SOURCE_KST")"
          SOURCE_SHA="$(sha256sum "$BRIEF_TMP" | awk '{print $1}')"

          if [ -n "$AFTER_UTC" ]; then
            SOURCE_EPOCH="$(date -u -d "$SOURCE_UTC" +%s 2>/dev/null || echo 0)"
            AFTER_EPOCH="$(date -u -d "$AFTER_UTC" +%s 2>/dev/null || echo 0)"
            if [ "$AFTER_EPOCH" -gt 0 ] && [ "$SOURCE_EPOCH" -le "$AFTER_EPOCH" ]; then
              echo "KR_SOURCE_NOT_NEWER source=$SOURCE_UTC after=$AFTER_UTC"
              exit 0
            fi
          fi

          curl --fail --location --silent --show-error \
            --connect-timeout 15 --max-time 60 \
            --retry 3 --retry-delay 2 \
            --user-agent "SignalFind-Public-Mirror/1.0" \
            "$DOC_URL" -o "$DOC_TMP"

          DOC_BYTES="$(wc -c < "$DOC_TMP" | tr -d ' ')"
          [ "$DOC_BYTES" -ge 200 ] || { echo "CURRENT MASTER too small" >&2; exit 1; }
          if grep -qiE '^\s*<!doctype html|^\s*<html' "$DOC_TMP"; then
            echo "Unexpected HTML response from CURRENT MASTER" >&2
            exit 1
          fi

          {
            printf '[SIGNALFIND_SOURCE]\n'
            printf 'refreshed_at_kst: %s\n' "$SOURCE_KST_ISO"
            printf 'refreshed_at_utc: %s\n' "$SOURCE_UTC"
            printf 'source_sha256: %s\n' "$SOURCE_SHA"
            printf 'source_url: %s\n' "$SOURCE_URL"
            printf 'trigger_cron: github:%s:brief-full-direct-sync\n\n' "${{ github.event_name }}"
            cat "$BRIEF_TMP"
            printf '\n\n============================================================\n'
            printf '[CURRENT MASTER — GOOGLE DOC]\n'
            printf 'SignalFind KR CURRENT MASTER\n'
            printf '============================================================\n\n'
            cat "$DOC_TMP"
            printf '\n'
          } > "$COMBINED_TMP"

          mv "$COMBINED_TMP" "$FILE"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "KR_BRIEF_FULL_FETCH_PASS generated_kst=$SOURCE_KST bytes=$BRIEF_BYTES"

      - name: Commit KR public brief if changed
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          FILE="kr-brief.txt"
          if git diff --quiet -- "$FILE"; then
            echo "KR_PUBLIC_SYNC=UNCHANGED"
            exit 0
          fi
          git config user.name "signalfind-ai-brief-bot"
          git config user.email "signalfind-ai-brief-bot@users.noreply.github.com"
          git add "$FILE"
          git commit -m "chore: sync KR public AI brief from brief-full"
          git push
          echo "KR_PUBLIC_SYNC=PASS"
