name: Refresh KR Brief Now

on:
  workflow_dispatch:
    inputs:
      after_utc:
        description: "Wait until Supabase KR mirror is newer than this UTC time"
        required: false
        default: ""
        type: string
  push:
    paths:
      - ".github/workflows/refresh-kr-now.yml"
  # Public self-heal redundancy. GitHub cron is UTC.
  # During KR market hours, poll the Supabase mirror every 5 minutes so both
  # Cloudflare :40 refreshes and manual KR refreshes propagate to public GitHub
  # without requiring cross-repo GitHub write/dispatch permission from Worker.
  schedule:
    - cron: "40,45,50,55 0 * * 1-5"   # 09:40~09:55 KST
    - cron: "*/5 1-6 * * 1-5"         # 10:00~15:55 KST
    - cron: "0,5,10,15,20 7 * * 1-5"  # 16:00~16:20 KST

permissions:
  contents: write

concurrency:
  group: signalfind-kr-public-self-heal
  cancel-in-progress: true

jobs:
  refresh-kr-now:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync latest KR mirror with CURRENT MASTER
        id: sync
        shell: bash
        env:
          AFTER_UTC: ${{ inputs.after_utc || '' }}
        run: |
          set -euo pipefail

          MIRROR_BRIEF_URL="https://hhmgsaprbpcdajniykro.supabase.co/storage/v1/object/public/signalfind-us/latest/ai/kr-brief.txt"
          MIRROR_META_URL="https://hhmgsaprbpcdajniykro.supabase.co/storage/v1/object/public/signalfind-us/latest/ai/kr-brief-meta.json"
          DOC_URL="https://docs.google.com/document/d/1LCZZ5xl6u2y5vvxR2XgF3nZ_nm3P9nX4kyuk3-QLvM8/export?format=txt"
          FILE="kr-brief.txt"

          META_TMP="$(mktemp)"
          BRIEF_TMP="$(mktemp)"
          DOC_TMP="$(mktemp)"
          COMBINED_TMP="$(mktemp)"

          LAST_UTC="$(sed -n 's/^refreshed_at_utc:[[:space:]]*//p' "$FILE" | head -n1 || true)"
          WAIT_UNTIL="$AFTER_UTC"
          if [ -z "$WAIT_UNTIL" ]; then
            WAIT_UNTIL="$LAST_UTC"
          fi

          MIRROR_UTC=""
          MIRROR_SHA=""
          for attempt in $(seq 1 18); do
            curl --fail --location --silent --show-error \
              --connect-timeout 15 --max-time 30 \
              --retry 1 --retry-delay 1 \
              --user-agent "SignalFind-Public-Mirror/1.0" \
              "${MIRROR_META_URL}?_=$(date +%s%N)" -o "$META_TMP"

            MIRROR_UTC="$(python - "$META_TMP" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              data = json.load(f)
          print(str(data.get('fetched_at_utc') or '').strip())
          PY
            )"
            MIRROR_SHA="$(python - "$META_TMP" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              data = json.load(f)
          print(str(data.get('sha256') or '').strip())
          PY
            )"

            if [ -z "$MIRROR_UTC" ]; then
              echo "Missing fetched_at_utc in KR mirror meta" >&2
              exit 1
            fi

            MIRROR_EPOCH="$(date -u -d "$MIRROR_UTC" +%s 2>/dev/null || echo 0)"
            WAIT_EPOCH="$(date -u -d "$WAIT_UNTIL" +%s 2>/dev/null || echo 0)"
            if [ -z "$WAIT_UNTIL" ] || [ "$WAIT_EPOCH" -eq 0 ] || [ "$MIRROR_EPOCH" -gt "$WAIT_EPOCH" ]; then
              echo "KR_PUBLIC_SYNC=MIRROR_READY attempt=$attempt mirror=$MIRROR_UTC after=$WAIT_UNTIL"
              break
            fi

            if [ "$attempt" -eq 18 ]; then
              echo "KR mirror did not advance in time: mirror=$MIRROR_UTC after=$WAIT_UNTIL" >&2
              exit 1
            fi
            sleep 5
          done

          if [ "${{ github.event_name }}" = "schedule" ] && [ -n "$LAST_UTC" ]; then
            MIRROR_EPOCH="$(date -u -d "$MIRROR_UTC" +%s 2>/dev/null || echo 0)"
            LAST_EPOCH="$(date -u -d "$LAST_UTC" +%s 2>/dev/null || echo 0)"
            if [ "$MIRROR_EPOCH" -gt 0 ] && [ "$LAST_EPOCH" -ge "$MIRROR_EPOCH" ]; then
              echo "KR_PUBLIC_SYNC=SKIP mirror_not_newer mirror=$MIRROR_UTC public=$LAST_UTC"
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          curl --fail --location --silent --show-error \
            --connect-timeout 15 --max-time 60 \
            --retry 2 --retry-delay 2 \
            --user-agent "SignalFind-Public-Mirror/1.0" \
            "${MIRROR_BRIEF_URL}?_=$(date +%s%N)" -o "$BRIEF_TMP"

          BRIEF_BYTES="$(wc -c < "$BRIEF_TMP" | tr -d ' ')"
          if [ "$BRIEF_BYTES" -lt 10000 ]; then
            echo "KR mirror brief too small: $BRIEF_BYTES bytes" >&2
            exit 1
          fi
          if grep -qiE '^\s*<!doctype html|^\s*<html' "$BRIEF_TMP"; then
            echo "Unexpected HTML response from KR mirror brief" >&2
            exit 1
          fi

          if [ -n "$MIRROR_SHA" ]; then
            ACTUAL_SHA="$(sha256sum "$BRIEF_TMP" | awk '{print $1}')"
            if [ "$ACTUAL_SHA" != "$MIRROR_SHA" ]; then
              echo "KR mirror SHA mismatch" >&2
              exit 1
            fi
          fi

          curl --fail --location --silent --show-error \
            --connect-timeout 15 --max-time 60 \
            --retry 2 --retry-delay 2 \
            --user-agent "SignalFind-Public-Mirror/1.0" \
            "$DOC_URL" -o "$DOC_TMP"

          DOC_BYTES="$(wc -c < "$DOC_TMP" | tr -d ' ')"
          if [ "$DOC_BYTES" -lt 200 ]; then
            echo "CURRENT MASTER too small: $DOC_BYTES bytes" >&2
            exit 1
          fi
          if grep -qiE '^\s*<!doctype html|^\s*<html' "$DOC_TMP"; then
            echo "Unexpected HTML response from KR CURRENT MASTER" >&2
            exit 1
          fi

          REFRESHED_KST="$(TZ=Asia/Seoul date -d "$MIRROR_UTC" +'%Y-%m-%dT%H:%M:%S+09:00')"
          {
            printf '[SIGNALFIND_MIRROR]\n'
            printf 'refreshed_at_kst: %s\n' "$REFRESHED_KST"
            printf 'refreshed_at_utc: %s\n' "$MIRROR_UTC"
            printf 'source_sha256: %s\n' "$MIRROR_SHA"
            printf 'trigger_cron: github:%s:mirror-self-heal\n\n' "${{ github.event_name }}"
            cat "$BRIEF_TMP"
            printf '\n\n============================================================\n'
            printf '[CURRENT MASTER — GOOGLE DOC]\n'
            printf 'SignalFind KR CURRENT MASTER\n'
            printf '============================================================\n\n'
            cat "$DOC_TMP"
            printf '\n'
          } > "$COMBINED_TMP"

          mv "$COMBINED_TMP" "$FILE"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "KR_PUBLIC_SYNC=READY mirror=$MIRROR_UTC bytes=$BRIEF_BYTES"

      - name: Commit KR public brief if changed
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          FILE="kr-brief.txt"
          if git diff --quiet -- "$FILE" && git ls-files --error-unmatch "$FILE" >/dev/null 2>&1; then
            echo "KR_PUBLIC_SYNC=UNCHANGED"
            exit 0
          fi
          git config user.name "signalfind-ai-brief-bot"
          git config user.email "signalfind-ai-brief-bot@users.noreply.github.com"
          git add "$FILE"
          git commit -m "chore: sync KR public AI brief from mirror"
          git push
          echo "KR_PUBLIC_SYNC=PASS"
