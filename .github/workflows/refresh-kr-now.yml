name: Refresh KR Brief Now

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/refresh-kr-now.yml"
  # Independent backup for the Cloudflare :40 primary refresh.
  # 00:45~06:45 UTC = 09:45~15:45 KST, 07:15 UTC = 16:15 KST final backup.
  schedule:
    - cron: "45 0-6 * * 1-5"
    - cron: "15 7 * * 1-5"

permissions:
  contents: write

# Cloudflare remains the primary KR refresh scheduler.
# Scheduled runs here are a failover only: if the Cloudflare heartbeat is fresh,
# the backup exits without fetching or committing.
# Manual force refresh marker: 2026-09-01 10:41 KST.

jobs:
  refresh-kr-now:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide whether backup refresh is needed
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "KR_BACKUP_GUARD=FORCE event=${{ github.event_name }}"
            exit 0
          fi

          LAST_UTC="$(sed -n 's/^refreshed_at_utc:[[:space:]]*//p' kr-brief.txt | head -n1 || true)"
          if [ -z "$LAST_UTC" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "KR_BACKUP_GUARD=RUN reason=no_cloudflare_heartbeat"
            exit 0
          fi

          NOW_EPOCH="$(date -u +%s)"
          LAST_EPOCH="$(date -u -d "$LAST_UTC" +%s 2>/dev/null || echo 0)"
          AGE="$((NOW_EPOCH - LAST_EPOCH))"
          if [ "$LAST_EPOCH" -gt 0 ] && [ "$AGE" -ge 0 ] && [ "$AGE" -le 600 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "KR_BACKUP_GUARD=SKIP heartbeat_age_seconds=$AGE"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "KR_BACKUP_GUARD=RUN heartbeat_age_seconds=$AGE"
          fi

      - name: Refresh KR brief with CURRENT MASTER
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          BRIEF_URL="https://signalfind.co.kr/ai/brief-latest.txt"
          DOC_URL="https://docs.google.com/document/d/1LCZZ5xl6u2y5vvxR2XgF3nZ_nm3P9nX4kyuk3-QLvM8/export?format=txt"
          FILE="kr-brief.txt"

          BRIEF_TMP="$(mktemp)"
          DOC_TMP="$(mktemp)"
          COMBINED_TMP="$(mktemp)"

          curl --fail --location --silent --show-error \
            --connect-timeout 15 --max-time 60 \
            --retry 2 --retry-delay 2 \
            --user-agent "SignalFind-Public-Mirror/1.0" \
            "$BRIEF_URL" -o "$BRIEF_TMP"

          BRIEF_BYTES="$(wc -c < "$BRIEF_TMP" | tr -d ' ')"
          if [ "$BRIEF_BYTES" -lt 512 ]; then
            echo "Brief too small: $BRIEF_BYTES bytes" >&2
            exit 1
          fi
          if grep -qiE '^\s*<!doctype html|^\s*<html' "$BRIEF_TMP"; then
            echo "Unexpected HTML response from KR brief" >&2
            exit 1
          fi

          curl --fail --location --silent --show-error \
            --connect-timeout 15 --max-time 60 \
            --retry 2 --retry-delay 2 \
            --user-agent "SignalFind-Public-Mirror/1.0" \
            "$DOC_URL" -o "$DOC_TMP"

          DOC_BYTES="$(wc -c < "$DOC_TMP" | tr -d ' ')"
          if [ "$DOC_BYTES" -lt 200 ]; then
            echo "CURRENT MASTER too small: $DOC_BYTES bytes" >&2
            exit 1
          fi
          if grep -qiE '^\s*<!doctype html|^\s*<html' "$DOC_TMP"; then
            echo "Unexpected HTML response from KR CURRENT MASTER" >&2
            exit 1
          fi

          REFRESHED_UTC="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          REFRESHED_KST="$(TZ=Asia/Seoul date +'%Y-%m-%dT%H:%M:%S+09:00')"
          {
            printf '[SIGNALFIND_MIRROR]\n'
            printf 'refreshed_at_kst: %s\n' "$REFRESHED_KST"
            printf 'refreshed_at_utc: %s\n' "$REFRESHED_UTC"
            printf 'trigger_cron: github:%s\n\n' "${{ github.event_name }}"
            cat "$BRIEF_TMP"
            printf '\n\n============================================================\n'
            printf '[CURRENT MASTER — GOOGLE DOC]\n'
            printf 'SignalFind KR CURRENT MASTER\n'
            printf '============================================================\n\n'
            cat "$DOC_TMP"
            printf '\n'
          } > "$COMBINED_TMP"
          mv "$COMBINED_TMP" "$FILE"

      - name: Commit KR brief if changed
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          FILE="kr-brief.txt"
          if git diff --quiet -- "$FILE" && git ls-files --error-unmatch "$FILE" >/dev/null 2>&1; then
            echo "KR_BRIEF_UNCHANGED"
            exit 0
          fi
          git config user.name "signalfind-ai-brief-bot"
          git config user.email "signalfind-ai-brief-bot@users.noreply.github.com"
          git add "$FILE"
          git commit -m "chore: refresh KR public AI brief"
          git push
